version: 2

goal:
  title: "PostHog Insight Activation"
  slug: "posthog-insight-activation"
  kind: existing_plan
  tranche: "Foil launch conversion dashboard has useful insights or a documented no-real-traffic blocker without fake production events."
  status: complete
  oracle:
    signal: "The PostHog dashboard has real insights for install_click, dmg_click, ios_preview_click, local_provider_guide_click, bridge_interest_click, and blog_cta_click filtered by product=foil/site_url/environment, or the board records that real event volume is not yet sufficient and keeps the exact insight backlog."
    cadence: "after Scout findings, after each Worker package, and at final audit"
    final_proof: "The PostHog dashboard has real insights for install_click, dmg_click, ios_preview_click, local_provider_guide_click, bridge_interest_click, and blog_cta_click filtered by product=foil/site_url/environment, or the board records that real event volume is not yet sufficient and keeps the exact insight backlog."
  intake:
    original_request: "Plan the next conveyor of GoalBuddy prep boards for Foil web launch follow-up work."
    interpreted_outcome: "Foil launch conversion dashboard has useful insights or a documented no-real-traffic blocker without fake production events."
    input_shape: existing_plan
    audience: "Foil maintainers continuing the web launch conveyor."
    authority: approved
    proof_type: artifact
    completion_proof: "The PostHog dashboard has real insights for install_click, dmg_click, ios_preview_click, local_provider_guide_click, bridge_interest_click, and blog_cta_click filtered by product=foil/site_url/environment, or the board records that real event volume is not yet sufficient and keeps the exact insight backlog."
    likely_misfire: "Creating pretty dashboards from fake events or unfiltered shared-project traffic."
    blind_spots_considered:
      - "The shared PostHog project also contains BugDrop traffic."
      - "There may be too little real Foil production traffic yet."
      - "Dashboard UI work may require logged-in browser access."
    existing_plan_facts:
      - "Vercel, PostHog, SEO, install/download trust, Sentry foundation, privacy/legal, and blog conversion foundations have recent merged receipts."
      - "Sentry production activation remains blocked on project-write/DSN access unless credentials are granted."
      - "Supabase capture remains deferred unless a concrete approved capture use case appears."
      - "Use local live GoalBuddy boards and recommended defaults."
      - "Do not start /goal runs during prep."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/posthog-insight-activation/"
    command: "npx goalbuddy board docs/goals/posthog-insight-activation"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Inspect current PostHog dashboard, event availability, filters, and docs; identify whether real insights can be safely added now."
    inputs:
      - "docs/goals/posthog-insight-activation/goal.md"
      - "Current repository files relevant to this launch area"
      - "Recent merged PRs and docs when useful"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Prefer concrete file paths, commands, URLs, service settings, or source-backed receipts over generic advice."
      - "Do not collect or expose secrets."
      - "Do not make public copy claim the bridge is shipped yet."
    expected_output:
      - "Evidence map"
      - "Credential, production-access, legal, or destructive-permission blockers"
      - "Largest safe useful next slice"
      - "Candidate Worker package with allowed_files, verify commands, and stop_if conditions"
    receipts:
      - "docs/goals/posthog-insight-activation/notes/t001-scout.md"
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Choose dashboard insight creation, docs/backlog update, or blocked receipt based on real event availability and access."
    inputs:
      - "T001 receipt"
      - "docs/goals/posthog-insight-activation/goal.md"
      - "Current repo status"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Reject weak proof or plans that only document intent."
      - "Require allowed_files, verify commands, and stop_if conditions for the Worker package."
    expected_output:
      - "approved | revise | blocked"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred or blocked follow-ups"
    receipts:
      - "docs/goals/posthog-insight-activation/notes/t002-judge.md"
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Document the no-real-traffic blocker and exact PostHog insight backlog without seeding fake events."
    allowed_files:
      - "docs/analytics.md"
      - "docs/goals/posthog-insight-activation/state.yaml"
      - "docs/goals/posthog-insight-activation/notes/"
    verify:
      - "npm run check:analytics"
      - "npm run check:launch"
      - "manual PostHog dashboard receipt"
    stop_if:
      - "Need files outside allowed_files."
      - "Need credentials, production access, destructive permission, or legal approval that the operator has not granted."
      - "The selected behavior or public claim is ambiguous."
      - "Verification fails twice with the same unexplained failure."
    receipts:
      - "docs/goals/posthog-insight-activation/notes/t003-worker.md"
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether PostHog insight activation satisfies the oracle or is explicitly blocked on real traffic/access."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "Goal oracle"
    constraints:
      - "Read-only."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if safe local follow-up slices remain."
      - "Reject completion on weak proof, missing service receipts, stale URLs, broken assets, or unsupported bridge claims."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipts:
      - "docs/goals/posthog-insight-activation/notes/t999-final-audit.md"

checks:
  dirty_fingerprint: "PostHog no-real-traffic blocker documented on codex/posthog-insight-activation"
  last_verification:
    result: blocked_on_real_traffic
    task: T003
    commands:
      - "PostHog dashboard lookup for project 422537 dashboard 1696677"
      - "PostHog event taxonomy lookup for six Foil conversion events"
      - "PostHog last-30-days filtered count for Foil production conversion events"
      - "npm run check:analytics"
      - "npm run check:launch"
  full_outcome_complete: true
