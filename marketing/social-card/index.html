<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foil social card</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1280px;
        height: 640px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #071215;
        background:
          radial-gradient(circle at 82% 18%, rgb(31 95 102 / 12%), transparent 32%),
          #fbfbf8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .card {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 58px 64px;
        isolation: isolate;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #0a3f44;
        font-size: 28px;
        font-weight: 760;
        letter-spacing: -0.02em;
      }

      .brand img {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(7 18 21 / 15%);
      }

      .copy {
        position: relative;
        z-index: 3;
        width: 585px;
      }

      h1 {
        max-width: 580px;
        margin: 62px 0 24px;
        color: #071215;
        font-size: 68px;
        font-weight: 780;
        letter-spacing: -0.055em;
        line-height: 0.98;
      }

      .subhead {
        max-width: 510px;
        margin: 0;
        color: #435356;
        font-size: 25px;
        font-weight: 520;
        letter-spacing: -0.022em;
        line-height: 1.3;
      }

      .accent {
        display: inline-block;
        width: 72px;
        height: 6px;
        margin-top: 30px;
        border-radius: 999px;
        background: #d79a3d;
      }

      .app-window {
        position: absolute;
        z-index: 1;
        top: 74px;
        left: 688px;
        width: 710px;
        height: auto;
        border: 1px solid rgb(10 63 68 / 18%);
        border-radius: 22px;
        box-shadow: 0 32px 80px rgb(7 18 21 / 20%);
      }

      .recording {
        position: absolute;
        z-index: 2;
        top: 446px;
        left: 736px;
        width: 450px;
        height: auto;
        filter: drop-shadow(0 18px 32px rgb(7 18 21 / 24%));
      }

      .fade {
        position: absolute;
        z-index: 2;
        inset: 0 auto 0 575px;
        width: 180px;
        background: linear-gradient(90deg, #fbfbf8 18%, rgb(251 251 248 / 0%));
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="Foil social card">
      <div class="copy">
        <div class="brand">
          <img src="../../assets/foil-mark.svg" alt="">
          <span>Foil</span>
        </div>
        <h1>Talk to agents at the speed of thought.</h1>
        <p class="subhead">macOS dictation for AI-first work</p>
        <span class="accent" aria-hidden="true"></span>
      </div>
      <img class="app-window" src="../../assets/screenshots/foil-app-home.png" alt="">
      <img class="recording" src="../../assets/audio-ux/recording-floating-status.png" alt="">
      <div class="fade" aria-hidden="true"></div>
    </main>
  </body>
</html>
