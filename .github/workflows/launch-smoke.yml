name: Launch Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      smoke_url:
        description: "Optional deployed preview or production URL to smoke test"
        required: false
        type: string
      site_url:
        description: "Expected canonical URL for deployed smoke"
        required: false
        default: "https://sayfoil.com"
        type: string
      expect_posthog:
        description: "Assert deployed PostHog public config"
        required: false
        default: false
        type: boolean
      expected_analytics_env:
        description: "Expected FOIL_ANALYTICS_ENV when asserting PostHog"
        required: false
        default: ""
        type: string
      expect_sentry:
        description: "Assert deployed Sentry public config"
        required: false
        default: false
        type: boolean

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run local launch checks
        run: npm run check:launch

      - name: Run deployed smoke check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_url != '' }}
        env:
          SMOKE_URL: ${{ inputs.smoke_url }}
          SITE_URL: ${{ inputs.site_url || 'https://sayfoil.com' }}
          EXPECT_POSTHOG: ${{ inputs.expect_posthog && '1' || '' }}
          EXPECTED_ANALYTICS_ENV: ${{ inputs.expected_analytics_env }}
          EXPECT_SENTRY: ${{ inputs.expect_sentry && '1' || '' }}
        run: npm run check:deployed
