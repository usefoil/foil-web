name: Launch Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      smoke_url:
        description: "Optional deployed preview or production URL to smoke test"
        required: false
        type: string

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run local launch checks
        run: npm run check:launch

      - name: Run deployed smoke check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_url != '' }}
        env:
          SMOKE_URL: ${{ inputs.smoke_url }}
        run: npm run check:deployed
